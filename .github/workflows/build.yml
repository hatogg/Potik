name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['apk/**', 'README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore
        uses: actions/cache@v4
        with:
          path: potik.p12
          key: potik-keystore-v1

      - name: Prepare keystore
        env:
          KS_B64: ${{ secrets.POTIK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > potik.p12; fi
          if [ ! -f potik.p12 ]; then
            keytool -genkeypair -keystore potik.p12 -storetype PKCS12 -alias potik -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass potik-android -keypass potik-android -dname "CN=Potik, O=X44TO, C=UA"
          fi

      - name: Build APK
        id: build
        env:
          STORE_PASS: ${{ secrets.POTIK_STORE_PASS || 'potik-android' }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Enable KVM
        if: success()
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator check (real speed test + UI)
        if: success()
        continue-on-error: true
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/emulator-test.sh

      - name: Publish results to ci branch
        if: always()
        run: |
          mkdir -p out
          cp build.log out/ 2>/dev/null || true
          cp -r ci-out/* out/ 2>/dev/null || true
          cp app/build/outputs/apk/release/*.apk out/Potik-release.apk 2>/dev/null || true
          echo "sha=$GITHUB_SHA build=${{ steps.build.outcome }} run=$GITHUB_RUN_ID" > out/status.txt
          cd out
          git init -q
          git checkout -q -b ci
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "CI $GITHUB_SHA"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Potik-apk
          path: app/build/outputs/apk/release/*.apk
