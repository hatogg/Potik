name: Probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Mobile Safari/537.36"
          curl -s -m 20 -A "$UA" -H "Referer: https://speed.cloudflare.com/" -H "Origin: https://speed.cloudflare.com" -w "\nmeta code=%{http_code}\n" https://speed.cloudflare.com/meta > meta_browser.txt
          curl -s -m 20 -A "Potik/1.0 (Android)" -w "\nmeta code=%{http_code}\n" https://speed.cloudflare.com/meta > meta_app.txt
          for b in 50000000 100000000 200000000 250000000 300000000; do curl -s -m 60 -o /dev/null -w "bytes=$b code=%{http_code} size=%{size_download} speed=%{speed_download}\n" "https://speed.cloudflare.com/__down?bytes=$b" >> sizes.txt; done
          for u in "https://ipinfo.io/json" "https://ipwho.is/" "http://ip-api.com/json/?fields=status,country,city,isp,org,as,query" "https://api.ip.sb/geoip"; do echo "== $u" >> isp.txt; curl -s -m 15 -A "Potik/1.0" "$u" >> isp.txt; echo >> isp.txt; done
          # parallel download 8 streams for ~8s
          start=$(date +%s.%N)
          for i in $(seq 1 8); do (curl -s -m 8 -o /dev/null -w "%{size_download}\n" "https://speed.cloudflare.com/__down?bytes=100000000" >> par.txt) & done; wait
          end=$(date +%s.%N)
          python3 -c "import sys; t=float('$end')-float('$start'); b=sum(int(x) for x in open('par.txt').read().split()); print('parallel8: %.1f Mbit/s over %.1fs' % (b*8/t/1e6, t))" >> sizes.txt
          date -u > when.txt
      - name: Publish
        run: |
          cd out
          git init -q && git checkout -q -b probe && git add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm probe
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
